spring.application.name=back

# MariaDB datasource configuration
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:board_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Reduce Hibernate SQL and database connection details in logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Hide Hibernate database connection details from startup logs
logging.level.org.hibernate.orm.connections.pooling=WARN

# Hide Flyway database connection details from logs
logging.level.org.flywaydb.core.FlywayExecutor=WARN

# Flyway database migration configuration
spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional Spring Security debugging; enable only when diagnosing security issues
# logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.security.web.access=TRACE

# Optional error message output for local development only
# server.error.include-message=always

# Attachment upload directory
app.upload.dir=${user.home}/board-project-uploads

# Maximum attachment upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
